description: 'Excite@Home (At Home Corporation) was a broadband cable-internet provider and web-portal
  company formed when the @Home Network merged with the Excite web portal in 1999. Backed by Kleiner
  Perkins, it delivered high-speed residential internet over cable partners and operated the Excite
  consumer portal, before filing for bankruptcy and ceasing operations in 2001. It is a defunct
  pre-API-era consumer company surfaced from a venture portfolio; it publishes no developer platform,
  OpenAPI, or live API surface, so this profile remains an identity-only stub with no API artifacts.'
